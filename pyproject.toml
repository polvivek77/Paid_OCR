[project]
name = "ocr-benchmark"
version = "0.1.0"
description = "Compare text extraction from PDFs / images / tables across popular OCR & document parsing tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Vivek Pol" }]

dependencies = [
    # UI
    "streamlit>=1.36",
    # Common
    "numpy>=1.26,<2.0",
    "pillow>=10.0,<11",
    "httpx>=0.27,<1",
    "opencv-python>=4.9",
    "pandas>=2.0",
    "pdf2image>=1.17",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    # Cloud vision LLM engines (API keys in .env)
    "openai>=1.50",
    "anthropic>=0.40",
    # OCR / document tools
    "paddleocr>=2.7",
    # Exactly one PaddlePaddle runtime: the GPU build (it also runs on CPU).
    # Never add the CPU `paddlepaddle` package too — both own the `paddle`
    # namespace. cu129 builds include RTX 50-series (sm_120) kernels.
    "paddlepaddle-gpu==3.4.0",
    "setuptools",  # imported by paddle at runtime
    "surya-ocr>=0.6",
    "python-doctr>=0.9",
    "pytesseract>=0.3.10",
    "easyocr>=1.7",
    "pdfplumber>=0.11",
    "camelot-py>=0.11",
    "docling>=1.7",
    "marker-pdf>=0.2",
    # Torch — resolved from the CUDA index below, never PyPI (PyPI's Windows
    # wheels are CPU-only). cu128+ is required for RTX 50-series (sm_120).
    "torch>=2.7",
    "torchvision>=0.22",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# uv-specific config; keep index defaults
prerelease = "allow"
# Resolve for Windows only: on Linux, CUDA torch and paddlepaddle-gpu pin
# conflicting nvidia-*-cu12 wheels and can't share one environment.
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
paddlepaddle-gpu = { index = "paddle-cu129" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the real NVIDIA GPU and CUDA builds installed",
    "integration: runs real engines end-to-end (slow; cloud engines cost money)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engines"]
